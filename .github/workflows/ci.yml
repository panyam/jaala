name: ci

on:
  push:
    branches: [main]
  pull_request:

# Every job only reads the checkout (#459: Scorecard's Token-Permissions check).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      # The generated corpus skips under -race (#143): it evaluates one program at a time, and the
      # detector made it nine times slower. Here it runs at its default 300 seeds, so its controls hold,
      # and the step fails unless it ran rather than skipped.
      - name: corpus
        run: |
          go test -count=1 ./datalog -run '^TestGeneratedProgramsAgree$' -v | tee corpus.log
          grep -q '^--- PASS: TestGeneratedProgramsAgree ' corpus.log
      # The engine runs in the browser for its first host, so it may import nothing that does not
      # build for WebAssembly: no os, net or cgo.
      - name: wasm build
        run: GOOS=js GOARCH=wasm go build ./...
      # Only the standard library. A dependency here becomes every host's dependency.
      - name: standard library only
        run: |
          extra=$(go list -deps ./... | grep '\.' | grep -v '^github.com/panyam/jaala' | grep -v '^vendor/' || true)
          if [ -n "$extra" ]; then echo "non-stdlib dependencies:"; echo "$extra"; exit 1; fi

  # The plain-language front end is a module of its own, so no core package can import it. It stays
  # standard library and jaala only, and builds for the browser as the engine does.
  nl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontends/nl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: frontends/nl/go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: wasm build
        run: GOOS=js GOARCH=wasm go build ./...
      - name: standard library and jaala only
        run: |
          extra=$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./... | grep -v '^github.com/panyam/jaala' || true)
          if [ -n "$extra" ]; then echo "dependencies outside jaala:"; echo "$extra"; exit 1; fi

  # The local-model clients are a module of their own (#330), so the root's ./... doesn't reach them.
  # They may use the network, but nothing outside the standard library and jaala.
  nlmodels:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontends/nlmodels
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: frontends/nlmodels/go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: wasm build
        run: GOOS=js GOARCH=wasm go build ./...
      - name: standard library and jaala only
        run: |
          extra=$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./... | grep -v '^github.com/panyam/jaala' || true)
          if [ -n "$extra" ]; then echo "dependencies outside jaala:"; echo "$extra"; exit 1; fi

  # The Cypher front end is a module of its own (#352), so no core package can import it and what it
  # comes to depend on reaches only its importers. It stays standard library and jaala only.
  cypher:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontends/cypher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: frontends/cypher/go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: wasm build
        run: GOOS=js GOARCH=wasm go build ./...
      - name: standard library and jaala only
        run: |
          extra=$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./... | grep -v '^github.com/panyam/jaala' || true)
          if [ -n "$extra" ]; then echo "dependencies outside jaala:"; echo "$extra"; exit 1; fi

  # stores/bolt is a module of its own (#411), so the Neo4j driver reaches only its importers, and
  # the root's ./... doesn't reach it. Its tests run against both servers, which JAALA_BOLT_REQUIRE
  # makes them fail rather than skip without.
  bolt:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26
        env:
          NEO4J_AUTH: none
        ports:
          - 7474:7474
          - 7687:7687
      memgraph:
        image: memgraph/memgraph:3.6.0
        ports:
          - 7688:7687
    defaults:
      run:
        working-directory: stores/bolt
    env:
      JAALA_BOLT_NEO4J: bolt://127.0.0.1:7687
      JAALA_BOLT_MEMGRAPH: bolt://127.0.0.1:7688
      JAALA_BOLT_REQUIRE: "1"
      JAALA_BOLT_SEEDS: "300"
      # The job's servers are its own, so the Cypher differential may clear them (#413).
      JAALA_BOLT_EXCLUSIVE: "1"
      JAALA_BOLT_CYPHER_SEEDS: "100"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: stores/bolt/go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: wait for the servers
        run: |
          for _ in $(seq 1 120); do curl -fs http://127.0.0.1:7474 >/dev/null && break; sleep 1; done
          for _ in $(seq 1 120); do (echo > /dev/tcp/127.0.0.1/7688) 2>/dev/null && break; sleep 1; done
      - name: test
        run: go test -race -count=1 -timeout 20m ./...
      - name: wasm build
        run: GOOS=js GOARCH=wasm go build ./...
      - name: jaala and the Neo4j driver only
        run: |
          extra=$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./... | grep -v '^github.com/panyam/jaala' | grep -v '^github.com/neo4j/neo4j-go-driver/v5' || true)
          if [ -n "$extra" ]; then echo "dependencies outside jaala and the driver:"; echo "$extra"; exit 1; fi

  # The MCP server is a module of its own (#347), so mcpkit and its dependencies reach no host that
  # doesn't import it, and the root's ./... doesn't reach it.
  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontends/mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: frontends/mcp/go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...

  # staticcheck, gosec and gitleaks over every module jaala ships (#459). Each tool's version is pinned
  # in the Makefile and run through go run, so this runs what a laptop's `make audit` runs. govulncheck
  # is time-sensitive rather than change-sensitive, so it runs on a clock instead (vulncheck.yml).
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks reads the whole history.
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: staticcheck
        run: make lint
      - name: gosec
        run: make seccheck
      - name: gitleaks
        run: make secrets

  # Naive against Soufflé on the generated corpus (#23). Soufflé is installed here only, from its
  # release, so it never becomes a Go dependency. The test is test code and runs the souffle binary.
  souffle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: install Soufflé 2.5
        run: |
          deb=x86_64-ubuntu-2404-souffle-2.5-Linux.deb
          curl -fsSL -o "$deb" "https://github.com/souffle-lang/souffle/releases/download/2.5/$deb"
          echo "6b86e554f6aa5abf8a8b55d8312ae37c0957c5bd6c9edeea89246db9406f645ec5e600b84fe6636b1c163da556f0da6c3d2dad46c1083413f2fcf4f95b9ac62c  $deb" | sha512sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y -qq "./$deb"
          souffle --version
      - name: Naive against Soufflé
        run: JAALA_SOUFFLE=require JAALA_SOUFFLE_SEEDS=1000 go test -count=1 -timeout 30m ./datalog -run '^(TestSouffleAgreesWithNaive|TestSouffleCatchesAWrongTranslation|TestSouffleTranslation)$' -v
