name: docs

# Builds and checks the documentation site in docsite/ and publishes it to GitHub Pages. The repo's
# Pages source must be "GitHub Actions" (Settings, Pages, Build and deployment).

on:
  push:
    branches: [main]
  # The build and its checks run on every PR, since an engine change can change what an example
  # answers once the docs run them (#106). Only main deploys.
  pull_request:
  workflow_dispatch:

# Only deploy writes, so only it gets Pages' token (#459: Scorecard's Token-Permissions check).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The footer names the commit and the nearest tag (git describe), which needs the tags.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: docsite/go.mod
          cache-dependency-path: docsite/go.sum
      # One definition of a build and its checks, in the Makefile.
      - name: Build and check the site
        run: make -C docsite check
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docsite/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
