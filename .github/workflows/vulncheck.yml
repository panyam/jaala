name: vulncheck

# Not on pull requests or pushes. govulncheck answers against an advisory database that moves on its
# own, so an advisory published today affects code that has not changed in months, and only a scan
# on a clock finds that case. It runs weekly, on each release tag, and by hand.
on:
  schedule:
    # Mondays 06:30 UTC.
    - cron: '30 6 * * 1'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Makefile pins govulncheck's version and covers every shipped module (#459). A red run on
      # a schedule is easy to miss, so the action files an issue on failure, or comments on the open
      # one whose title starts with "vulncheck:". Its defaults key the Go cache on every go.sum and
      # label the issue P1,bug.
      - uses: panyam/ci-actions/vulncheck@ecf33181dffa847874b7797b0593badea92cd2a4 # v0.1.1
        with:
          command: make vulncheck
