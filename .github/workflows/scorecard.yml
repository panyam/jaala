name: scorecard

# OpenSSF Scorecard, which rates the repository's security practices (branch protection, pinned
# actions, token permissions, a security policy) and publishes the result to api.scorecard.dev.
on:
  branch_protection_rule:
  schedule:
    - cron: '30 2 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      # publish_results signs its upload with the workflow's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned by commit SHA, as a third-party action that reads the repository should be.
      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
